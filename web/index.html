<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INBA War</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="hero">
      <img src="massa.png" alt="マッサ" class="hero-image">
    </header>
    <main class="menu">
      <button class="menu-btn" data-screen="sortie">
        <span class="btn-icon">⚔</span>
        <span class="btn-label">出撃</span>
      </button>
      <button class="menu-btn" data-screen="ranking">
        <span class="btn-icon">🏆</span>
        <span class="btn-label">ランキング</span>
      </button>
      <button class="menu-btn" data-screen="encyclopedia">
        <span class="btn-icon">📖</span>
        <span class="btn-label">敵図鑑</span>
      </button>
      <button class="menu-btn" data-screen="shop">
        <span class="btn-icon">🏪</span>
        <span class="btn-label">なかむら商店</span>
      </button>
    </main>
    <footer class="footer">
      <p>INBA War</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
